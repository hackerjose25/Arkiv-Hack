<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Independent ArkivSight embed consumer</title>
<style>body{font:16px system-ui;max-width:1100px;margin:40px auto;padding:20px;background:#101724;color:#d7e4f2}input{padding:12px;width:70%;margin:10px}button{padding:12px}iframe{width:100%;height:650px;border:1px solid #435267;border-radius:12px}</style>
<h1>Independent dashboard consumer</h1><p>Serve this file from any HTTP origin. Enter the ArkivSight deployment and an actual published entity key. The embedded app reads directly from Tiramisu; viewers need no wallet.</p>
<form id="form"><label>Deployment origin <input id="origin" type="url" value="http://localhost:3000" required></label><br><label>Dashboard entity key <input id="key" pattern="0x[0-9a-fA-F]{64}" required></label><button>Load public dashboard</button></form><p id="status" role="status"></p><iframe id="frame" title="Independent ArkivSight dashboard" loading="lazy"></iframe>
<script>document.getElementById('form').addEventListener('submit',event=>{event.preventDefault();const origin=new URL(document.getElementById('origin').value);if(!['https:','http:'].includes(origin.protocol))return;const key=document.getElementById('key').value;if(!/^0x[0-9a-fA-F]{64}$/.test(key))return;document.getElementById('frame').src=new URL('/embed/'+key,origin.origin).href;document.getElementById('status').textContent='Loading a public definition. Any network failure is shown inside the dashboard.';});</script></html>
